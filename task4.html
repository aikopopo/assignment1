<body>

    <h1 id="grades-title">Student Grades</h1>

    <table class="grades-table">

        <tr>
            <th>Subject</th>
            <th>Grade</th>
            <th>Credits</th>
        </tr>

        <tr>
            <td>Algorithms and Data Structures</td>
            <td>90</td>
            <td>5</td>
        </tr>

        <tr>
            <td>Psychology</td>
            <td>82</td>
            <td>5</td>
        </tr>

        <tr class="highlight-row">
            <td>History of Kazakhstan</td>
            <td>85</td>
            <td>5</td>
        </tr>

        <tr>
            <td>Physical Education</td>
            <td>70</td>
            <td rowspan="2">2</td>
        </tr>

        <tr>
            <td>Practice</td>
            <td>90</td>
        </tr>

        <tr>
            <td colspan="2"><strong>Total Credits</strong></td>
            <td><strong>22</strong></td>
        </tr>

    </table>


    <h1>Contact Form</h1>

    <form class="contact-form">

        <div class="form-group">
            <label for="name">Name:</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
            >
        </div>


        <div class="form-group">
            <label for="email">Email:</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
            >
        </div>


        <div class="form-group">
            <label for="role">Role:</label>

            <select id="role" name="role">
                <option value="student">Student</option>
                <option value="teacher">Teacher</option>
                <option value="developer">Developer</option>
            </select>
        </div>


        <div class="form-group">

            <label>Would you recommend this website?</label>

            <div class="radio-group">
                <label>
                    <input type="radio" name="recommend" value="yes">
                    Yes
                </label>

                <label>
                    <input type="radio" name="recommend" value="no">
                    No
                </label>
            </div>

        </div>


        <div class="form-group">

            <label for="message">Message:</label>

            <textarea
                id="message"
                name="message"
                rows="5"
                placeholder="Write your message"
            ></textarea>

        </div>


        <button type="submit">Submit</button>

    </form>


    <footer class="task2-footer">
        <p>© 2026 Aiko - Software Engineering Student</p>
    </footer>

</body>
</html>
